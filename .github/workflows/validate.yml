name: Validate data

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python toolchain via uv
        run: uv sync --frozen

      - name: Validate event/speaker JSON and verify aggregates are up to date
        run: uv run scripts/build.py --check
