<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/favicon.png">
<title>PyLadies Kaohsiung 活動封面（1~4 位講者）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" crossorigin="anonymous">
<style>
:root{
  /* 配色沿用 pyladies_speaker_card */
  --paper:#F4F2EE;
  --card:#FFFFFF;
  --ink:#33332F;
  --muted:#6E6E68;
  --line:#E7E2DA;
  --hair:#F0EDE8;
  --accent:#FA3C0A;   /* 主標橘 */
  --mark:#6A8ED4;     /* 講者名藍 */
  --photo-bg:#ECEDF0;
  --photo-icon:#B9BCC4;

  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --label:"Archivo","Noto Sans TC",system-ui,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--paper);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  padding:40px 16px;
}

/* 浮動工具列（截圖卡片時不入鏡） */
.toolbar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:50;flex-wrap:wrap;justify-content:flex-end}
.toolbar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.toolbar button:hover{background:#d43208}
.toolbar select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.10)}
body.locked .ps{pointer-events:none;cursor:default}
body.locked .tools{display:none !important}
body.locked .hint{display:none !important}

/* ── 卡片本體 ── */
.card{
  --k:1;             /* 文字縮放係數，由 fit() 調整 */
  --pk:1;            /* 頭像縮放係數，由 fit() 調整 */
  --title-base:40px;
  --sub-base:18px;
  --vgap:22px;       /* head / speakers / foot 之間的最小間距 */
  position:relative;
  flex:none;
  background:var(--card);
  overflow:hidden;
  box-shadow:0 4px 28px rgba(40,32,26,.12);
  display:flex;
  flex-direction:column;
}

/* 尺寸：封面 1200×630（KKTIX / FB 連結預覽）、方圖 1080×1080（IG） */
.card.s-cover{width:1200px;height:630px;padding:40px 52px 26px}
.card.s-square{width:1080px;height:1080px;padding:66px 64px 44px;--title-base:52px;--sub-base:22px;--vgap:34px}

/* ── 背景風格：由 .card 上的 bg-* class 決定，一次只顯示一組 ── */
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco > *{position:absolute;opacity:0;transition:opacity .2s}
.card > *:not(.deco){position:relative;z-index:1}

/* 1. 側邊色帶 */
.d-band{left:0;top:0;bottom:0;width:14px;background:linear-gradient(180deg,var(--accent) 0%,#F2724A 42%,var(--mark) 100%)}
.card.bg-band .d-band{opacity:1}

/* 2. 斜切色塊 */
.d-wedge{right:0;top:0;width:340px;height:300px;background:#FDEEE8;clip-path:polygon(100% 0,100% 100%,0 0)}
.d-wedge2{left:0;bottom:0;width:260px;height:200px;background:#EEF2FB;clip-path:polygon(0 100%,100% 100%,0 0)}
.card.bg-wedge .d-wedge,.card.bg-wedge .d-wedge2{opacity:1}

/* 3. 柔光漸層 */
.d-glow{inset:0;background:
  radial-gradient(560px 420px at 100% -8%, rgba(106,142,212,.20), transparent 70%),
  radial-gradient(520px 400px at -6% 108%, rgba(250,60,10,.13), transparent 70%)}
.card.bg-glow .d-glow{opacity:1}

/* ── 標頭 ── */
.head{flex:none;min-width:0}

.eyebrow{
  font-family:var(--label);
  font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mark);
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--hair)}
.eyebrow span{white-space:nowrap;min-width:6px}
.card.s-square .eyebrow{font-size:14px}

.title{
  font-size:calc(var(--title-base) * var(--k));
  font-weight:900;line-height:1.24;
  color:var(--accent);
  letter-spacing:.01em;
}
.rule{width:58px;height:5px;background:var(--accent);border-radius:3px;margin:14px 0}
.subtitle{
  font-size:calc(var(--sub-base) * var(--k));
  line-height:1.65;color:var(--ink);font-weight:400;
}

/* ── 講者列 ── */
.speakers{
  --spn:25px;   /* 姓名 */
  --spr:15px;   /* 職稱 */
  --spt:15.5px; /* 講題 */
  --ps-size:160px;
  flex:1 1 auto;min-height:0;
  display:grid;
  align-content:center;
  justify-content:center;
  justify-items:center;
  column-gap:28px;row-gap:26px;
  padding:var(--vgap) 0;
}
.speakers.n1{--spn:32px;--spr:17px;--spt:19px;--ps-size:200px;--sp-max:760px;grid-template-columns:minmax(0,760px)}
.speakers.n2{--spn:28px;--spr:16px;--spt:17px;--ps-size:186px;--sp-max:420px;grid-template-columns:repeat(2,minmax(0,1fr))}
.speakers.n3{--spn:24px;--spr:15px;--spt:15.5px;--ps-size:162px;--sp-max:326px;grid-template-columns:repeat(3,minmax(0,1fr))}
.speakers.n4{--spn:21px;--spr:13.5px;--spt:14px;--ps-size:136px;--sp-max:252px;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:20px}

/* 方圖時 4 人改 2×2，版面比較舒服 */
.card.s-square .speakers.n4{--spn:26px;--spr:16px;--spt:17px;--ps-size:186px;--sp-max:400px;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;row-gap:40px}
.card.s-square .speakers.n3{--spn:28px;--spr:17px;--spt:18px;--ps-size:212px;--sp-max:316px}
.card.s-square .speakers.n2{--spn:36px;--spr:20px;--spt:21px;--ps-size:286px;--sp-max:450px;column-gap:48px}
.card.s-square .speakers.n1{--spn:42px;--spr:22px;--spt:24px;--ps-size:320px;--sp-max:860px}

.sp{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;width:100%;max-width:var(--sp-max,100%)}
.speakers.n1 .sp{flex-direction:row;align-items:center;text-align:left;gap:36px}
.speakers.n1 .sp-info{flex:1;min-width:0}
.speakers.n1 .sp-name{margin-top:0}
.sp-info{min-width:0;width:100%}

.ps{
  width:calc(var(--ps-size) * var(--pk));
  height:calc(var(--ps-size) * var(--pk));
  border-radius:50%;
  flex:none;
  position:relative;
  background-color:var(--photo-bg);
  background-repeat:no-repeat;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 0 0 5px #fff, 0 0 0 7px var(--hair);
}
.ps.empty{cursor:pointer}
.ps.dragging{cursor:grabbing}
.ps .placeholder{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  color:var(--photo-icon);
  pointer-events:none;z-index:1;
}
.ps .placeholder svg{width:100%;height:100%}
.ps:not(.empty) .placeholder{display:none}

.tools{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:3;opacity:0;transition:opacity .15s}
.ps:hover .tools{opacity:1}
.tbtn{background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;font-size:11px;padding:4px 7px;cursor:pointer;font-family:inherit;line-height:1}
.tbtn:hover{background:var(--accent)}

.sp-name{margin-top:14px;font-size:calc(var(--spn) * var(--k));font-weight:700;color:var(--mark);line-height:1.3;letter-spacing:.02em}
.sp-role{margin-top:4px;font-size:calc(var(--spr) * var(--k));color:var(--muted);line-height:1.5}
.sp-topic{
  margin-top:10px;padding-top:10px;
  border-top:1px solid var(--hair);
  font-size:calc(var(--spt) * var(--k));
  color:var(--ink);line-height:1.6;font-weight:500;
}

/* 空欄位：編輯時顯示淡色提示字，鎖定 / 截圖 / 匯出時整個收起來不留痕跡 */
.sp-name:empty,.sp-role:empty,.sp-topic:empty,.subtitle:empty{display:none}
body:not(.locked) .sp-name:empty,
body:not(.locked) .sp-role:empty,
body:not(.locked) .sp-topic:empty,
body:not(.locked) .subtitle:empty{display:block}
body:not(.locked) [contenteditable]:empty::before{
  content:attr(data-ph);
  color:#C6C2BA;font-weight:400;letter-spacing:0;
}

/* ── 頁尾：左邊時間地點，右邊主辦單位 ── */
.foot{
  flex:none;
  padding-top:16px;border-top:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.meta-row{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--muted);line-height:1.5}
.meta-row svg{flex:none;color:var(--mark)}
.card.s-square .meta-row{font-size:19px}

.brand{display:flex;align-items:center;gap:14px;flex:none}
.foot-lbl{font-size:13px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.logo{
  height:54px;min-width:130px;
  border-radius:8px;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.card.s-square .logo{height:72px;min-width:180px}
.logo.empty{border:1px dashed var(--line)}
.logo .lg-ph{font-size:12px;color:#B4B0A8;letter-spacing:.06em}
.logo:not(.empty) .lg-ph{display:none}

.hint{position:fixed;left:16px;bottom:14px;font-size:12px;color:#9C988F;letter-spacing:.04em;z-index:50;background:rgba(255,255,255,.85);padding:6px 10px;border-radius:7px}

[contenteditable]{outline:none}
[contenteditable]:focus{background:rgba(250,60,10,.06);border-radius:3px}

/* 截圖模式：?shot=1 */
body.shot{padding:0;background:#fff;display:block}
body.shot .toolbar,body.shot .hint,body.shot .tools{display:none !important}
body.shot .card{box-shadow:none}

@media (max-width:1280px){
  body:not(.shot){padding:24px 8px}
  body:not(.shot) .card.s-cover{transform:scale(.72);transform-origin:top center;margin-bottom:-176px}
  body:not(.shot) .card.s-square{transform:scale(.72);transform-origin:top center;margin-bottom:-302px}
}

/* 回社群工具頁 */
.tool-back{position:fixed;top:14px;left:14px;z-index:50;background:#fff;color:#2c2c2a;border:1px solid #e4e0d8;border-radius:8px;padding:8px 12px;font-size:13px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.tool-back:hover{color:#FA3C0A}
.toolbar button:disabled{opacity:.6;cursor:wait}
.toolbar{max-width:calc(100vw - 150px)}
body.shot .tool-back{display:none}
</style>
</head>

<div class="hint">點擊頭像上傳・拖曳調位置・滾輪縮放・文字可直接點擊修改</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const card=document.getElementById('card');
const speakers=document.getElementById('speakers');

/* ── 頭像：填滿圓形、可拖曳 / 縮放 ── */
function recompute(ps,keep){
  if(!ps.dataset.natw) return;
  const fw=ps.clientWidth,fh=ps.clientHeight;
  if(!fw||!fh) return;
  const nw=+ps.dataset.natw,nh=+ps.dataset.nath;
  const s=Math.max(fw/nw,fh/nh);
  ps._bw=nw*s; ps._bh=nh*s;
  if(ps._z===undefined||!keep){ ps._z=ps._z||1; ps._cx=undefined; }
  apply(ps);
}
function apply(ps){
  const fw=ps.clientWidth,fh=ps.clientHeight;
  const dw=ps._bw*ps._z,dh=ps._bh*ps._z;
  if(ps._px===undefined||ps._cx){ ps._px=(fw-dw)/2; ps._py=(fh-dh)/2; ps._cx=false; }
  ps._px= dw>=fw ? clamp(ps._px,fw-dw,0) : (fw-dw)/2;
  ps._py= dh>=fh ? clamp(ps._py,fh-dh,0) : (fh-dh)/2;
  ps.style.backgroundSize=dw+'px '+dh+'px';
  ps.style.backgroundPosition=ps._px+'px '+ps._py+'px';
}
function zoomAt(ps,f){
  if(!ps.dataset.natw) return;
  const fw=ps.clientWidth,fh=ps.clientHeight;
  const dw0=ps._bw*ps._z,dh0=ps._bh*ps._z;
  const ix=(fw/2-ps._px)/dw0, iy=(fh/2-ps._py)/dh0;
  ps._z=clamp(ps._z*f,0.3,6);
  const dw1=ps._bw*ps._z,dh1=ps._bh*ps._z;
  ps._px=fw/2-ix*dw1; ps._py=fh/2-iy*dh1; apply(ps);
}
function recomputeAll(keep){ document.querySelectorAll('.ps').forEach(p=>recompute(p,keep)); }

let pickTarget=null;
function pickImage(el){ pickTarget=el; document.getElementById('fileInput').click(); }

document.querySelectorAll('.ps').forEach(ps=>{
  let sx,sy,ox,oy,drag=false;
  ps.addEventListener('pointerdown',e=>{
    if(e.target.closest('.tools')) return;
    if(ps.classList.contains('empty')){ pickImage(ps); return; }
    drag=true; ps.classList.add('dragging'); ps.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; ox=ps._px; oy=ps._py;
  });
  ps.addEventListener('pointermove',e=>{ if(!drag) return; ps._px=ox+(e.clientX-sx); ps._py=oy+(e.clientY-sy); apply(ps); });
  const end=()=>{ drag=false; ps.classList.remove('dragging'); };
  ps.addEventListener('pointerup',end); ps.addEventListener('pointercancel',end);
  ps.addEventListener('wheel',e=>{ if(ps.classList.contains('empty')) return; e.preventDefault(); zoomAt(ps,e.deltaY<0?1.08:1/1.08); },{passive:false});
  ps.querySelector('.tools').addEventListener('click',e=>{
    const act=e.target.dataset.act; if(!act) return;
    if(act==='replace'){ pickImage(ps); return; }
    if(ps.classList.contains('empty')) return;
    if(act==='zin') zoomAt(ps,1.15);
    else if(act==='zout') zoomAt(ps,1/1.15);
    else if(act==='center'){ ps._cx=true; apply(ps); }
  });
});

document.getElementById('logo').addEventListener('click',function(){ if(!document.body.classList.contains('locked')) pickImage(this); });

document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file||!pickTarget) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    if(pickTarget.classList.contains('logo')){
      pickTarget.style.backgroundImage="url('"+ev.target.result+"')";
      pickTarget.classList.remove('empty');
      return;
    }
    const img=new Image();
    img.onload=()=>{
      pickTarget.style.backgroundImage="url('"+ev.target.result+"')";
      pickTarget.dataset.natw=img.naturalWidth; pickTarget.dataset.nath=img.naturalHeight;
      pickTarget.classList.remove('empty');
      pickTarget._z=1; pickTarget._px=undefined; recompute(pickTarget);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file); this.value='';
});

/* ── 自動縮放：量出「標頭 + 講者列 + 頁尾」所需高度，超出就縮字、再不夠才縮頭像 ── */
function neededHeight(){
  const cs=getComputedStyle(card);
  const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const head=card.querySelector('.head'), foot=card.querySelector('.foot');
  const scs=getComputedStyle(speakers);
  const rowGap=parseFloat(scs.rowGap)||0;
  const vpad=parseFloat(scs.paddingTop)+parseFloat(scs.paddingBottom);

  const items=[...speakers.querySelectorAll('.sp')].filter(e=>e.style.display!=='none');
  const cols=(scs.gridTemplateColumns||'').split(' ').filter(Boolean).length||1;
  let rowsH=0;
  for(let i=0;i<items.length;i+=cols){
    let m=0;
    for(let j=i;j<Math.min(i+cols,items.length);j++) m=Math.max(m,items[j].offsetHeight);
    rowsH+=m;
  }
  rowsH+=rowGap*Math.max(0,Math.ceil(items.length/cols)-1);

  return pad + head.offsetHeight + vpad + rowsH + foot.offsetHeight;
}

function fit(){
  let k=1,pk=1,guard=0;
  const set=()=>{card.style.setProperty('--k',k);card.style.setProperty('--pk',pk);};
  set();
  const limit=card.clientHeight;
  while(neededHeight()>limit && guard++<60){
    if(k>0.74){ k=+(k-0.02).toFixed(3); }
    else if(pk>0.78){ pk=+(pk-0.02).toFixed(3); set(); recomputeAll(true); continue; }
    else break;
    set();
  }
  recomputeAll(true);
}
document.querySelectorAll('.eyebrow span,.title,.subtitle,.sp-name,.sp-role,.sp-topic,.meta-row span').forEach(el=>el.addEventListener('input',fit));

/* ── 工具列 ── */
function setCount(n){
  n=clamp(n,1,4);
  speakers.className='speakers n'+n;
  speakers.querySelectorAll('.sp').forEach(sp=>{ sp.style.display = (+sp.dataset.i<=n) ? '' : 'none'; });
  document.getElementById('nSel').value=n;
  requestAnimationFrame(()=>{ recomputeAll(); fit(); });
}
function setKicker(t){
  const el=document.querySelector('.eyebrow span');
  el.textContent=t;
  const sel=document.getElementById('kickerSel');
  sel.value=[...sel.options].some(o=>o.value===t)?t:'';
  fit();
}
function setBg(cls){
  const size=[...card.classList].find(c=>c.startsWith('s-'))||'s-cover';
  card.className='card '+cls+' '+size;
  document.getElementById('bgSel').value=cls;
}
function setSize(cls){
  const bg=[...card.classList].find(c=>c.startsWith('bg-'))||'bg-band';
  card.className='card '+bg+' '+cls;
  document.getElementById('sizeSel').value=cls;
  requestAnimationFrame(()=>{ recomputeAll(); fit(); });
}

let locked=false;
function toggleLock(){
  locked=!locked;
  document.body.classList.toggle('locked',locked);
  document.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable',locked?'false':'true'));
  document.getElementById('lockBtn').textContent=locked?'🔓 解鎖':'🔒 鎖定';
}

function exportFixed(){
  fit();
  const clone=card.cloneNode(true);
  clone.querySelectorAll('.tools, .hint').forEach(e=>e.remove());
  clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  clone.querySelectorAll('[data-natw]').forEach(e=>{e.removeAttribute('data-natw');e.removeAttribute('data-nath');});
  const baseCss=document.querySelector('style').innerHTML;
  const lockCss='.toolbar{display:none}body{padding:0;background:#fff;display:block}.card{box-shadow:none}'
    +'.ps,.logo{cursor:default;pointer-events:none}.logo.empty{border:none}'
    +'.sp-name:empty,.sp-role:empty,.sp-topic:empty,.subtitle:empty{display:none !important}'
    +'[data-ph]:empty::before{content:none !important}';
  const doc='<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><title>PyLadies Kaohsiung 活動封面</title><style>'+baseCss+lockCss+'</style></head><body>'+clone.outerHTML+'</body></html>';
  const blob=new Blob([doc],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='活動封面_fixed.html'; a.click(); URL.revokeObjectURL(a.href);
}

/* ── 網址參數：?n=2&bg=wedge&size=square&shot=1（給 headless 截圖用） ── */
function applyParams(){
  const q=new URLSearchParams(location.search);
  if(q.get('size')) setSize('s-'+q.get('size'));
  if(q.get('bg')) setBg('bg-'+q.get('bg'));
  if(q.get('kicker')) setKicker(q.get('kicker'));
  if(q.get('title')) document.querySelector('.title').textContent=q.get('title');
  if(q.get('subtitle')) document.querySelector('.subtitle').textContent=q.get('subtitle');
  setCount(+(q.get('n')||2));
  if(q.get('shot')){ document.body.classList.add('shot'); if(!locked) toggleLock(); }
}

function initAll(){ applyParams(); recomputeAll(); fit(); }
window.addEventListener('load',()=>requestAnimationFrame(initAll));
window.addEventListener('resize',()=>{ recomputeAll(true); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{recomputeAll(true);fit();});
</script>
